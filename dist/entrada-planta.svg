ke-width="1" stroke-dasharray=""/><polyline points="828.52,288.2 828.52,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="831.76,288.2 831.76,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="835,288.2 835,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="838.24,288.2 838.24,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="841.48,288.2 841.48,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="844.72,288.2 844.72,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="847.96,288.2 847.96,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="851.2,288.2 851.2,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="854.44,288.2 854.44,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="857.6800000000001,288.2 857.6800000000001,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="860.92,288.2 860.92,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="864.16,288.2 864.16,325" fill="none" stroke="#233e52" stroke-width="1" stroke-dasharray=""/><polyline points="786.4,286.6 885.76,286.6 885.76,325" fill="none" stroke="#179da7" stroke-width="3" stroke-dasharray=""/><polyline points="775.6,306.6 874.96,306.6 874.96,338.6" fill="none" stroke="#a76417" stroke-width="3" stroke-dasharray=""/><polyline points="670.84,655.88 729.16,655.88" fill="none" stroke="#179da7" stroke-width="5" stroke-dasharray=""/><polyline points="700,637 700,297.8 613.6,297.8" fill="none" stroke="#a76417" stroke-width="3" stroke-dasharray=""/><polyline points="700,297.8 754,297.8" fill="none" stroke="#a76417" stroke-width="3" stroke-dasharray=""/><text x="550" y="110" font-size="18" fill="#233e52">CAMPO / CDM · visual</text><text x="540" y="696" font-size="18" fill="#233e52">EXPLANADA Y PORTONES</text><text x="800" y="650" font-size="15" fill="#233e52">Puerta derecha: hueco 1,10 m; uso desconocido</text><polyline points="795,643 731.32,592.2" fill="none" stroke="#617582" stroke-width="1" stroke-dasharray=""/><text x="210" y="570" font-size="18" fill="#233e52">Vestíbulo continuo ±0,00</text><text x="210" y="595" font-size="15" fill="#233e52">5,40 m de ancho / 20,68 m hasta el cruce</text><polyline points="540,570 670.84,541" fill="none" stroke="#617582" stroke-width="1" stroke-dasharray=""/><text x="820" y="532" font-size="15" fill="#233e52">Se elimina la bifurcación en d = 23,6–26,6</text><text x="820" y="555" font-size="15" fill="#233e52">y sus dos conectores longitudinales.</text><text x="120" y="315" font-size="18" fill="#233e52">CRUCE ÚNICO / PASILLO A COTA ±0,00</text><text x="120" y="340" font-size="15" fill="#233e52">4,00 m entre caras; paso contiguo 1,50 m</text><polyline points="461,308 678.4,306.6" fill="none" stroke="#617582" stroke-width="1" stroke-dasharray=""/><text x="870" y="224" font-size="15" fill="#233e52">Rampa izquierda: 4,00 m / +0,72 m</text><text x="870" y="247" font-size="15" fill="#233e52">Escalera derecha: 4 × 0,18 m; huella 0,44 m</text><polyline points="860,235 700,225.8" fill="none" stroke="#617582" stroke-width="1" stroke-dasharray=""/><text x="40" y="750" font-size="16" fill="#233e52">Observado: vigas claras, abertura frontal, rampa izquierda, escalera corta derecha, pasos junto a escaleras laterales.</text><text x="40" y="782" font-size="16" fill="#233e52">Confirmado por el usuario: no existe el primer pasillo; el cruce real está antes de comenzar la subida frontal.</text><text x="40" y="814" font-size="16" fill="#233e52">Propuesto: vestíbulo de 20,68 m hasta el cruce y 24,68 m hasta la rampa, adaptados a la principal ampliada.</text><text x="40" y="846" font-size="16" fill="#233e52">El recuerdo de 10 m o más no es una medida. Las alturas y la longitud exceden las del estadio real por la ampliación.</text><text x="40" y="878" font-size="16" fill="#233e52">La rampa tiene 18 % propuesto; no se declara accesibilidad. Las escaleras laterales llegan a +4,20 m.</text><text x="40" y="910" font-size="16" fill="#233e52">Extremos del pasillo y baños: reserva ajustable sin interiores ni funciones de puertas inventadas.</text><text x="40" y="964" font-size="15" fill="#233e52">Modelo académico con dimensiones propuestas · v16 · Dibujos del modelo; no relevamiento ni capturas 3D.</text></g></svg>