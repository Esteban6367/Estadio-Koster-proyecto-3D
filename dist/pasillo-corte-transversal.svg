/text><text x="40" y="880" font-size="16" fill="#233e52">Muros, coronaciones, aberturas y separación respecto de los sectores inferiores siguen la organización de las referencias.</text><text x="40" y="964" font-size="15" fill="#233e52">Modelo académico con dimensiones propuestas · v16 · Dibujos del modelo; no relevamiento ni capturas 3D.</text></g></svg>