6,590 1064,569.84 1087.68,569.84" fill="none" stroke="#179da7" stroke-width="5" stroke-dasharray=""/><polyline points="1087.68,569.84 1101.76,569.84 1101.76,574.88 1115.8400000000001,574.88 1115.8400000000001,579.92 1129.92,579.92 1129.92,584.96 1144,584.96 1144,590 1208,590" fill="none" stroke="#3a4e70" stroke-width="3" stroke-dasharray=""/><polyline points="1064,569.84 1049.92,569.84" fill="none" stroke="#3a4e70" stroke-width="4" stroke-dasharray=""/><polyline points="1049.92,574.88 1035.8400000000001,574.88" fill="none" stroke="#3a4e70" stroke-width="4" stroke-dasharray=""/><polyline points="1035.8400000000001,579.92 1021.76,579.92" fill="none" stroke="#3a4e70" stroke-width="4" stroke-dasharray=""/><polyline points="1021.76,584.96 1007.6800000000001,584.96" fill="none" stroke="#3a4e70" stroke-width="4" stroke-dasharray=""/><rect x="799.6800000000001" y="445.79999999999995" width="8.319999999999993" height="41.44000000000001" fill="#3a4e70" stroke="#617582"/><rect x="936" y="479.4" width="7.680000000000007" height="30.800000000000004" fill="#c9d6db" stroke="#617582"/><polyline points="146.24,590 146.24,497.6" fill="none" stroke="#179da7" stroke-width="5" stroke-dasharray=""/><rect x="256" y="525.6" width="35.200000000000045" height="64.39999999999999" fill="#738792" stroke="#617582"/><text x="138" y="167" font-size="18" fill="#233e52">Muros ajustados al intradós real del modelo</text><text x="138" y="192" font-size="16" fill="#233e52">Gradas +4,20 / +7,98 / +12,18 y cabina conservadas</text><text x="185" y="664" font-size="18" fill="#233e52">Vestíbulo cubierto</text><text x="740" y="664" font-size="18" fill="#233e52">Cruce a nivel cero</text><text x="990" y="664" font-size="18" fill="#233e52">Rampa y escalera</text><polyline points="808,605 808,635" fill="none" stroke="#a76417" stroke-width="2" stroke-dasharray=""/><text x="715" y="692" font-size="15" fill="#a76417">Antes de subir</text><polyline points="304,690.8 734.4,690.8" fill="none" stroke="#81658c" stroke-width="4" stroke-dasharray=""/><polyline points="875.8399999999999,724.4 1208,724.4" fill="none" stroke="#81658c" stroke-width="4" stroke-dasharray=""/><text x="40" y="775" font-size="16" fill="#233e52">Vestuarios −3,60 m y túnel −4,80 m, proyectados: no se desplazan ni se conectan con el público.</text><text x="40" y="809" font-size="16" fill="#233e52">Los muros llegan a las losas escalonadas. El piso de la cabina limita el techo central en su tramo.</text><text x="40" y="843" font-size="16" fill="#233e52">La cubierta metálica superior sigue siendo independiente; el pasillo entre sectores conserva su abertura al cielo.</text><text x="40" y="877" font-size="16" fill="#233e52">Se conserva la transición existente desde el descanso frontal a la circulación pública inferior, cerrada hacia la fosa.</text><text x="40" y="964" font-size="15" fill="#233e52">Modelo académico con dimensiones propuestas · v16 · Dibujos del modelo; no relevamiento ni capturas 3D.</text></g></svg>